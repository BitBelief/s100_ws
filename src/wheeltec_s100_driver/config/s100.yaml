/**:
  ros__parameters:
    port: /dev/ttyACM0
    baudrate: 115200

    # 固定重送頻率。STM32 看門狗約 1.0s 斷訊歸零，20 Hz 有足夠餘裕。
    tx_rate: 20.0
    # 本節點自己的超時，比韌體的 1.0s 短得多：0.5 m/s 滑 50 cm 在密集人流裡不可接受。
    cmd_timeout: 0.2

    # teleop_twist_keyboard 預設發 Twist；Nav2 Jazzy 發 TwistStamped。
    cmd_vel_type: twist

    max_linear: 0.8
    max_angular: 2.0

    # ⚠ 待做：直線 2 m + 原地轉 10 圈校正後填入實測值（實測 / 指令）。
    linear_scale: 1.0
    angular_scale: 1.0

    publish_tf: true
    odom_frame: odom
    base_frame: base_footprint
    imu_frame: imu_link

    # ⚠ placeholder，不是估計出來的不確定度。底盤韌體不回報它。
    pose_covariance_diagonal: [0.05, 0.05, 1.0e6, 1.0e6, 1.0e6, 0.1]
    twist_covariance_diagonal: [0.05, 0.05, 1.0e6, 1.0e6, 1.0e6, 0.1]
